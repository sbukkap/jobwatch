name: jobwatch

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (off the :00 mark, which GitHub delays most)
  workflow_dispatch: {}       # "Run workflow" button for manual runs

permissions:
  contents: write             # needed to commit seen.json back

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll job boards
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobwatch.py

      - name: Save seen jobs
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen jobs [skip ci]"
          git push
